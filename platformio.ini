[platformio]
default_envs = waveshare-clock

[env:waveshare-clock]
platform = platformio/espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
board = waveshare-esp32-s3-touch-lcd-5b
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/pio_config.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
