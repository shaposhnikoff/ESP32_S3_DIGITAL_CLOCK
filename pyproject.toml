[project]
name = "waveshare-clock-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click==8.1.7",
    "esptool==4.9.0",
    "platformio==6.1.18",
    "pydantic==2.12.4",
    "typer==0.20.0",
    "tzdata==2025.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "ruff==0.14.5",
]
